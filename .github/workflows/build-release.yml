# Build, sign and attest a release. Called only by release.yml. The build lives in a reusable
# workflow so the provenance attestation names this file as the builder (SLSA Build L3).
name: Build release

on:
  workflow_call:

permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # required for keyless cosign signing via GitHub OIDC
      attestations: write  # required for SLSA provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The .sigstore.json suffix is what Scorecard's Signed-Releases check and
      # sigstore tooling recognise as a Sigstore bundle.
      - name: Sign release artifacts
        env:
          COSIGN_YES: "true"
        run: |
          for artifact in dist/*.tar.gz dist/*.sbom.json dist/checksums.txt; do
            cosign sign-blob --bundle="${artifact}.sigstore.json" "${artifact}"
          done

      - name: Upload signature bundles to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          find dist -name "*.sigstore.json" -exec gh release upload "${tag}" {} --clobber \;

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v3.2.0
        with:
          subject-path: dist/*.tar.gz, dist/*.sbom.json, dist/checksums.txt
