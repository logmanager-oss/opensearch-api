name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "45 3 * * 2"  # every Tuesday at 03:45 UTC: a new advisory needs no commit to surface

permissions: read-all

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...  # Dependabot does not track this; bump by hand
