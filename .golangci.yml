version: "2"

run:
  timeout: 5m
  build-tags:
    - e2e

linters:
  # Defaults (errcheck, govet, ineffassign, staticcheck, unused) plus:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G117 # Password fields are inherent to a Basic-auth client; String/GoString redact them
        - G304 # user-supplied file paths are the feature: --env-file, @body files, runbooks
        - G704 # user-supplied endpoints are the feature: the tool is an HTTP client
    revive:
      rules:
        - name: early-return
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec # test fixtures: literal credentials, exec of the built binary, 0755 temp dirs

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/logmanager-oss/opensearch-api
