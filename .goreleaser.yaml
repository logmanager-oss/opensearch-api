version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: osapi
    main: ./cmd/osapi
    binary: osapi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Stay a draft until the release workflow has attached the cosign bundles and the provenance
# attestation. The workflow publishes as its last step.
release:
  draft: true

# One SPDX JSON SBOM per archive, produced by syft (installed in the release workflow).
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
