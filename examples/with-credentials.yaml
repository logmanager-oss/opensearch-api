# Authenticate with a username and password defined in the runbook, instead
# of -u/--password or OPENSEARCH_USERNAME/PASSWORD. Shows: defaults:
# credentials: with a literal username and a ${secret:...} password.
defaults:
  credentials:
    username: admin
    password: '${secret:OPENSEARCH_ADMIN_PASSWORD}'

calls:
  - name: cluster_health
    path: /_cluster/health

  - name: create_index
    method: PUT
    path: /my-index
    success-when: '.acknowledged'
